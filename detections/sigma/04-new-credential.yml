title: AWS long-lived credential created
id: c683ee67-0cd8-4aa0-870c-0fe5693732c0
status: experimental
description: >
  Detects creation of a long-lived IAM credential: an access key, a console login
  profile, or a service-specific credential. In an account built on short-lived
  role sessions this is rare and is a common persistence step after a compromise.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: Amit Kiran Deb
date: 2026/11/03
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
      - CreateAccessKey
      - CreateLoginProfile
      - CreateServiceSpecificCredential
  condition: selection
fields:
  - userIdentity.arn
  - requestParameters.userName
  - responseElements.accessKey.accessKeyId
falsepositives:
  - Automation or a provisioning process that legitimately rotates credentials; allowlist that principal.
level: high
tags:
  - attack.persistence
  - attack.t1098.001
