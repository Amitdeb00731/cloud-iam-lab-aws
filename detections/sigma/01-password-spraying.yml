title: AWS console password spraying or brute force
id: 9ad107a8-5392-4015-a6d3-66b403b78a35
status: experimental
description: >
  Detects many failed AWS console sign-ins from a single source IP in a short
  window, consistent with password spraying or brute force. The distinct-account
  variant (several usernames failing from one source) is the higher-confidence
  spray signal and is noted below.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: Amit Kiran Deb
date: 2026/11/03
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    responseElements.ConsoleLogin: Failure
  timeframe: 15m
  condition: selection | count() by sourceIPAddress >= 5
  # Higher-confidence spray variant (several distinct accounts from one source):
  #   condition: selection | count(userIdentity.userName) by sourceIPAddress >= 3
fields:
  - sourceIPAddress
  - userIdentity.userName
  - errorMessage
falsepositives:
  - A legitimate user mistyping their password several times from one location.
  - A shared corporate egress IP where many users sign in and some fail.
level: medium
tags:
  - attack.credential-access
  - attack.t1110.003
